<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 480" font-family="Segoe UI, Arial, sans-serif">
  <style>
    .uc { fill: #ffffff; stroke: #7a1f2b; stroke-width: 2; }
    .uctext { font-size: 14px; fill: #222; text-anchor: middle; }
    .actor { stroke: #333; stroke-width: 2; fill: none; }
    .actortext { font-size: 14px; fill: #222; text-anchor: middle; }
    .rel { stroke: #555; stroke-width: 1.5; fill: none; marker-end: url(#arrow); stroke-dasharray: 5,4; }
    .assoc { stroke: #333; stroke-width: 1.5; fill: none; }
    .reltext { font-size: 11px; fill: #7a1f2b; text-anchor: middle; font-style: italic; }
    .boundary { fill: none; stroke: #999; stroke-width: 1; stroke-dasharray: 4,3; }
    .title { font-size: 15px; fill: #333; text-anchor: middle; font-weight: bold; }
  </style>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#555"/>
    </marker>
  </defs>

  <rect x="160" y="20" width="790" height="420" class="boundary"/>
  <text x="555" y="45" class="title">Sistema de Prestamo de Equipos Tecnologicos</text>

  <!-- Actor -->
  <g transform="translate(70,250)">
    <circle cx="0" cy="0" r="12" class="actor"/>
    <line x1="0" y1="12" x2="0" y2="45" class="actor"/>
    <line x1="-20" y1="25" x2="20" y2="25" class="actor"/>
    <line x1="0" y1="45" x2="-18" y2="75" class="actor"/>
    <line x1="0" y1="45" x2="18" y2="75" class="actor"/>
    <text x="0" y="95" class="actortext">Encargado</text>
  </g>

  <!-- Left column: main use cases (cx=430, spans 260-600) -->
  <ellipse cx="430" cy="110" rx="170" ry="34" class="uc"/>
  <text x="430" y="114" class="uctext">Registrar Prestamo</text>

  <ellipse cx="430" cy="250" rx="170" ry="34" class="uc"/>
  <text x="430" y="254" class="uctext">Registrar Devolucion</text>

  <ellipse cx="430" cy="390" rx="170" ry="34" class="uc"/>
  <text x="430" y="394" class="uctext">Consultar Historial de Prestamos</text>

  <!-- Right column: included/extended use cases (cx=800, spans 660-940) -->
  <ellipse cx="800" cy="110" rx="140" ry="30" class="uc"/>
  <text x="800" y="114" class="uctext">Validar Disponibilidad</text>

  <ellipse cx="800" cy="250" rx="140" ry="30" class="uc"/>
  <text x="800" y="254" class="uctext">Registrar Equipo Danado</text>

  <ellipse cx="800" cy="390" rx="140" ry="30" class="uc"/>
  <text x="800" y="394" class="uctext">Calcular Atraso</text>

  <!-- Actor associations -->
  <line x1="108" y1="235" x2="260" y2="115" class="assoc"/>
  <line x1="112" y1="258" x2="260" y2="250" class="assoc"/>
  <line x1="108" y1="272" x2="260" y2="385" class="assoc"/>

  <!-- include / extend relations (short, stay in the gap between columns) -->
  <line x1="600" y1="110" x2="658" y2="110" class="rel"/>
  <text x="629" y="95" class="reltext">«include»</text>

  <line x1="600" y1="250" x2="658" y2="250" class="rel"/>
  <text x="629" y="235" class="reltext">«extend»</text>

  <line x1="600" y1="390" x2="658" y2="390" class="rel"/>
  <text x="629" y="375" class="reltext">«include»</text>
</svg>
