<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" font-family="Segoe UI, Arial, sans-serif">
  <style>
    .life { stroke: #555; stroke-width: 1; stroke-dasharray: 3,3; }
    .box { fill: #f7ecec; stroke: #7a1f2b; stroke-width: 1.5; }
    .title { font-size: 12px; fill: #222; text-anchor: middle; font-weight: bold; }
    .msg { stroke: #333; stroke-width: 1.3; fill: none; marker-end: url(#a2); }
    .ret { stroke: #333; stroke-width: 1.1; fill: none; stroke-dasharray: 4,3; marker-end: url(#a2); }
    .mtext { font-size: 11px; fill: #222; text-anchor: middle; }
    .frame { fill: none; stroke: #444; stroke-width: 1.2; }
    .tag { fill: #eee; stroke: #444; stroke-width: 1.2; }
    .tagtext { font-size: 11px; fill: #222; font-weight: bold; }
    .guard { font-size: 11px; fill: #222; font-style: italic; }
    .divider { stroke: #444; stroke-width: 1; stroke-dasharray: 4,3; }
  </style>
  <defs>
    <marker id="a2" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#333"/>
    </marker>
  </defs>

  <text x="450" y="20" font-size="15" font-weight="bold" text-anchor="middle">Secuencia: Registrar Prestamo</text>

  <!-- lifelines -->
  <g>
    <rect x="20" y="35" width="110" height="26" class="box"/>
    <text x="75" y="52" class="title">Encargado</text>
    <line x1="75" y1="61" x2="75" y2="415" class="life"/>

    <rect x="180" y="35" width="140" height="26" class="box"/>
    <text x="250" y="52" class="title">GestorPrestamos</text>
    <line x1="250" y1="61" x2="250" y2="415" class="life"/>

    <rect x="370" y="35" width="140" height="26" class="box"/>
    <text x="440" y="52" class="title">UsuarioRepository</text>
    <line x1="440" y1="61" x2="440" y2="415" class="life"/>

    <rect x="560" y="35" width="140" height="26" class="box"/>
    <text x="630" y="52" class="title">EquipoRepository</text>
    <line x1="630" y1="61" x2="630" y2="415" class="life"/>

    <rect x="750" y="35" width="140" height="26" class="box"/>
    <text x="820" y="52" class="title">PrestamoRepository</text>
    <line x1="820" y1="61" x2="820" y2="415" class="life"/>
  </g>

  <!-- msg 1 -->
  <line x1="75" y1="90" x2="250" y2="90" class="msg"/>
  <text x="162" y="83" class="mtext">registrarPrestamo(usId, eqId, dias)</text>

  <!-- ref frame: Validar Disponibilidad (interaccion incluida «include») -->
  <g>
    <rect x="235" y="105" width="410" height="105" class="frame"/>
    <polygon points="235,105 275,105 275,119 267,127 235,127" class="tag"/>
    <text x="243" y="120" class="tagtext">ref</text>
    <text x="440" y="120" class="mtext" font-weight="bold">Validar Disponibilidad</text>

    <line x1="250" y1="140" x2="440" y2="140" class="msg"/>
    <text x="345" y="134" class="mtext">buscar(usId)</text>
    <line x1="440" y1="158" x2="250" y2="158" class="ret"/>
    <text x="345" y="152" class="mtext">usuario</text>

    <line x1="250" y1="180" x2="630" y2="180" class="msg"/>
    <text x="440" y="174" class="mtext">buscar(eqId)</text>
    <line x1="630" y1="198" x2="250" y2="198" class="ret"/>
    <text x="440" y="192" class="mtext">equipo</text>
  </g>

  <!-- alt frame -->
  <g>
    <rect x="60" y="225" width="785" height="175" class="frame"/>
    <polygon points="60,225 100,225 100,239 92,247 60,247" class="tag"/>
    <text x="68" y="240" class="tagtext">alt</text>
    <text x="470" y="240" class="guard">[usuario.habilitado AND equipo.estaDisponible()]</text>

    <line x1="250" y1="262" x2="820" y2="262" class="msg"/>
    <text x="535" y="256" class="mtext">guardar(nuevoPrestamo)</text>
    <line x1="820" y1="280" x2="250" y2="280" class="ret"/>
    <text x="535" y="274" class="mtext">prestamo creado</text>

    <line x1="250" y1="300" x2="630" y2="300" class="msg"/>
    <text x="440" y="294" class="mtext">cambiarEstado(PRESTADO)</text>

    <line x1="250" y1="322" x2="75" y2="322" class="ret"/>
    <text x="162" y="316" class="mtext">confirmacion de prestamo</text>

    <line x1="60" y1="335" x2="845" y2="335" class="divider"/>
    <text x="68" y="350" class="guard">[else]</text>

    <line x1="250" y1="375" x2="75" y2="375" class="ret"/>
    <text x="460" y="369" class="mtext">rechazo (equipo no disponible o usuario no habilitado)</text>
  </g>
</svg>
