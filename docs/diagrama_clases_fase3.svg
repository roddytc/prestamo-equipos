<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 660" font-family="Segoe UI, Arial, sans-serif">
  <style>
    .cls { fill: #ffffff; stroke: #7a1f2b; stroke-width: 1.6; }
    .hdr { fill: #7a1f2b; }
    .hdrtext { font-size: 13px; fill: #fff; text-anchor: middle; font-weight: bold; }
    .body { font-size: 11.5px; fill: #222; }
    .divider { stroke: #7a1f2b; stroke-width: 1; }
    .rel { stroke: #444; stroke-width: 1.4; fill: none; }
    .lbl { font-size: 11px; fill: #333; }
    .mult { font-size: 10.5px; fill: #555; }
    .iface { font-style: italic; }
    .diamond { fill: #444; stroke: #444; }
    .new-cls { fill: #ffffff; stroke: #1f5c7a; stroke-width: 1.8; }
    .new-hdr { fill: #1f5c7a; }
    .new-text { fill: #1f5c7a; font-weight: bold; }
    .abstract { font-style: italic; }
  </style>
  <defs>
    <marker id="tri" markerWidth="14" markerHeight="12" refX="12" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#fff" stroke="#444" stroke-width="1"/>
    </marker>
    <marker id="dep" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#444" stroke-width="1.2"/>
    </marker>
  </defs>

  <!-- SolicitudPrestamo (NUEVO) -->
  <g transform="translate(30,30)">
    <rect width="220" height="90" class="new-cls"/>
    <rect width="220" height="24" class="new-hdr"/>
    <text x="110" y="16" class="hdrtext">SolicitudPrestamo</text>
    <line x1="0" y1="24" x2="220" y2="24" class="divider" stroke="#1f5c7a"/>
    <text x="8" y="40" class="body">- usuarioId: int</text>
    <text x="8" y="55" class="body">- equipoId: int</text>
    <text x="8" y="70" class="body">- dias: int</text>
    <text x="8" y="85" class="body" font-style="italic">(objeto de valor, solo lectura)</text>
  </g>

  <!-- Usuario -->
  <g transform="translate(300,30)">
    <rect width="190" height="110" class="cls"/>
    <rect width="190" height="24" class="hdr"/>
    <text x="95" y="16" class="hdrtext">Usuario</text>
    <line x1="0" y1="24" x2="190" y2="24" class="divider"/>
    <text x="8" y="40" class="body">- id: string</text>
    <text x="8" y="55" class="body">- nombre: string</text>
    <text x="8" y="70" class="body">- rol: RolUsuario</text>
    <text x="8" y="85" class="body">- habilitado: boolean</text>
    <line x1="0" y1="90" x2="190" y2="90" class="divider"/>
    <text x="8" y="104" class="body">+ puedeSolicitarPrestamo(): boolean</text>
  </g>

  <!-- Equipo (MODIFICADO) -->
  <g transform="translate(580,30)">
    <rect width="200" height="140" class="cls"/>
    <rect width="200" height="24" class="hdr"/>
    <text x="100" y="16" class="hdrtext">Equipo</text>
    <line x1="0" y1="24" x2="200" y2="24" class="divider"/>
    <text x="8" y="40" class="body">- id: string</text>
    <text x="8" y="55" class="body">- nombre: string</text>
    <text x="8" y="70" class="body">- categoria: string</text>
    <text x="8" y="85" class="body">- estado: EstadoEquipo</text>
    <line x1="0" y1="90" x2="200" y2="90" class="divider"/>
    <text x="8" y="104" class="body">+ estaDisponible(): boolean</text>
    <text x="8" y="118" class="body">+ cambiarEstado(e): void</text>
    <text x="8" y="132" class="new-text" font-size="11.5px">+ registrarDevolucion(danado): void</text>
  </g>

  <!-- NotificadorAtraso interface -->
  <g transform="translate(800,30)">
    <rect width="180" height="80" class="cls"/>
    <rect width="180" height="34" class="hdr"/>
    <text x="90" y="14" class="hdrtext iface">«interface»</text>
    <text x="90" y="29" class="hdrtext">NotificadorAtraso</text>
    <line x1="0" y1="34" x2="180" y2="34" class="divider"/>
    <text x="8" y="58" class="body">+ notificar(prestamo): void</text>
  </g>

  <!-- GestorPrestamos (MODIFICADO) -->
  <g transform="translate(30,260)">
    <rect width="250" height="215" class="cls"/>
    <rect width="250" height="24" class="hdr"/>
    <text x="125" y="16" class="hdrtext">GestorPrestamos</text>
    <line x1="0" y1="24" x2="250" y2="24" class="divider"/>
    <text x="8" y="40" class="body">- equipos: EquipoRepository</text>
    <text x="8" y="55" class="body">- usuarios: UsuarioRepository</text>
    <text x="8" y="70" class="body">- prestamos: PrestamoRepository</text>
    <text x="8" y="85" class="body">- observadores: NotificadorAtraso[]</text>
    <line x1="0" y1="90" x2="250" y2="90" class="divider"/>
    <text x="8" y="104" class="new-text" font-size="11.5px">+ registrarPrestamo(solicitud): Prestamo</text>
    <text x="8" y="119" class="new-text" font-size="11.5px">+ registrarDevolucionOk(id): Prestamo</text>
    <text x="8" y="134" class="new-text" font-size="11.5px">+ registrarDevolucionConDano(id): Prestamo</text>
    <text x="8" y="149" class="body">+ listarPrestamosActivos()</text>
    <text x="8" y="164" class="body">+ agregarObservador(n)</text>
    <text x="8" y="179" class="body">+ verificarAtrasos()</text>
    <text x="8" y="197" class="body" font-style="italic">- rechazarSi(), crearPrestamo(),</text>
    <text x="8" y="210" class="body" font-style="italic">  procesarDevolucion() [privados]</text>
  </g>

  <!-- Prestamo -->
  <g transform="translate(580,260)">
    <rect width="205" height="150" class="cls"/>
    <rect width="205" height="24" class="hdr"/>
    <text x="102" y="16" class="hdrtext">Prestamo</text>
    <line x1="0" y1="24" x2="205" y2="24" class="divider"/>
    <text x="8" y="40" class="body">- id: string</text>
    <text x="8" y="55" class="body">- fechaPrestamo: Date</text>
    <text x="8" y="70" class="body">- fechaDevEsperada: Date</text>
    <text x="8" y="85" class="body">- fechaDevReal?: Date</text>
    <text x="8" y="100" class="body">- estado: EstadoPrestamo</text>
    <line x1="0" y1="105" x2="205" y2="105" class="divider"/>
    <text x="8" y="119" class="body">+ estaAtrasado(): boolean</text>
    <text x="8" y="133" class="body">+ registrarDevolucion(): void</text>
  </g>

  <!-- Repository (NUEVO, clase base abstracta) -->
  <g transform="translate(290,405)">
    <rect width="220" height="65" class="new-cls"/>
    <rect width="220" height="34" class="new-hdr"/>
    <text x="110" y="14" class="hdrtext abstract">«abstract»</text>
    <text x="110" y="29" class="hdrtext">Repository&lt;TModel&gt;</text>
    <line x1="0" y1="34" x2="220" y2="34" class="divider" stroke="#1f5c7a"/>
    <text x="8" y="50" class="body">+ buscar(id) / guardar(e)</text>
  </g>

  <!-- Repositories (MODIFICADOS: ahora extienden Repository) -->
  <g transform="translate(60,510)">
    <rect width="190" height="70" class="cls"/>
    <rect width="190" height="22" class="hdr"/>
    <text x="95" y="15" class="hdrtext">PrestamoRepository</text>
    <line x1="0" y1="22" x2="190" y2="22" class="divider"/>
    <text x="8" y="38" class="body">+ listar() / listarActivos()</text>
    <text x="8" y="52" class="body" font-style="italic">[buscar/guardar heredados]</text>
  </g>

  <g transform="translate(300,510)">
    <rect width="180" height="70" class="cls"/>
    <rect width="180" height="22" class="hdr"/>
    <text x="90" y="15" class="hdrtext">EquipoRepository</text>
    <line x1="0" y1="22" x2="180" y2="22" class="divider"/>
    <text x="8" y="38" class="body"># modelo(): string</text>
    <text x="8" y="52" class="body" font-style="italic">[buscar/guardar heredados]</text>
  </g>

  <g transform="translate(520,510)">
    <rect width="180" height="70" class="cls"/>
    <rect width="180" height="22" class="hdr"/>
    <text x="90" y="15" class="hdrtext">UsuarioRepository</text>
    <line x1="0" y1="22" x2="180" y2="22" class="divider"/>
    <text x="8" y="38" class="body"># modelo(): string</text>
    <text x="8" y="52" class="body" font-style="italic">[buscar/guardar heredados]</text>
  </g>

  <!-- ConsolaNotificador -->
  <g transform="translate(800,560)">
    <rect width="180" height="60" class="cls"/>
    <rect width="180" height="22" class="hdr"/>
    <text x="90" y="15" class="hdrtext">ConsolaNotificador</text>
    <line x1="0" y1="22" x2="180" y2="22" class="divider"/>
    <text x="8" y="45" class="body">+ notificar(prestamo): void</text>
  </g>

  <!-- ===== Relaciones ===== -->

  <!-- Usuario 1 -- 0..* Prestamo -->
  <line x1="490" y1="85" x2="580" y2="305" class="rel"/>
  <text x="494" y="100" class="mult">1</text>
  <text x="545" y="290" class="mult">0..*</text>
  <text x="500" y="200" class="lbl">solicita</text>

  <!-- Equipo 1 -- 0..* Prestamo -->
  <line x1="680" y1="170" x2="680" y2="260" class="rel"/>
  <text x="688" y="187" class="mult">1</text>
  <text x="688" y="252" class="mult">0..*</text>

  <!-- GestorPrestamos -- SolicitudPrestamo (dependencia, NUEVA) -->
  <line x1="140" y1="260" x2="140" y2="120" class="rel" stroke="#1f5c7a" stroke-dasharray="4,3" marker-end="url(#dep)"/>
  <text x="150" y="195" class="new-text" font-size="10.5px">usa</text>

  <!-- GestorPrestamos compone los 3 repositorios -->
  <polygon points="110,475 116,468 122,475 116,482" class="diamond"/>
  <line x1="122" y1="475" x2="155" y2="510" class="rel"/>

  <polygon points="190,475 196,468 202,475 196,482" class="diamond"/>
  <line x1="202" y1="475" x2="390" y2="510" class="rel"/>

  <polygon points="250,475 256,468 262,475 256,482" class="diamond"/>
  <line x1="262" y1="475" x2="610" y2="510" class="rel"/>

  <!-- Generalizacion: los 3 repos extienden Repository (NUEVA) -->
  <line x1="155" y1="510" x2="335" y2="470" class="rel" stroke="#1f5c7a" marker-end="url(#tri)"/>
  <line x1="390" y1="510" x2="400" y2="470" class="rel" stroke="#1f5c7a" marker-end="url(#tri)"/>
  <line x1="610" y1="510" x2="465" y2="470" class="rel" stroke="#1f5c7a" marker-end="url(#tri)"/>

  <!-- GestorPrestamos -- NotificadorAtraso (0..*), ruta ortogonal -->
  <path d="M280,320 L300,320 L300,205 L910,205 L910,110" class="rel"/>
  <text x="340" y="197" class="lbl">notifica a</text>
  <text x="895" y="197" class="mult">0..*</text>

  <!-- ConsolaNotificador realiza NotificadorAtraso -->
  <line x1="940" y1="560" x2="940" y2="110" class="rel" stroke-dasharray="4,3" marker-end="url(#tri)"/>

  <!-- Leyenda -->
  <rect x="30" y="635" width="14" height="14" class="new-cls"/>
  <text x="50" y="646" class="body new-text">= nuevo o modificado en Fase 3 (SolicitudPrestamo, Repository, Equipo, GestorPrestamos)</text>
</svg>
